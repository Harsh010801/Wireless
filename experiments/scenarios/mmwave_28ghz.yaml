name: "Scenario H - 5G mmWave Street Canyon (28 GHz)"
description: "Dense urban microcell mmWave 28 GHz street canyon with LoS/NLoS state transition (IEEE Access 2026)"
frequency: 28000.0
frequency_unit: "MHz"
min_distance: 0.01          # 10 meters
max_distance: 1.0           # 1 km microcell
num_distance_points: 200
distance_unit: "km"
log_scale_distance: true
tx_power_dbm: 30.0          # 1 W mmWave small cell
tx_gain_dbi: 20.0           # Phased array beamforming
rx_gain_dbi: 5.0            # User terminal patch array
system_loss_db: 3.0
rx_sensitivity_dbm: -90.0
ht: 10.0                    # Lamp-post / street-canyon base station (m)
hr: 1.5                     # Pedestrian user terminal (m)
environment: "urban"
path_loss_exponent: 3.19
shadowing_std_db: 7.82
random_seed: 42
models:
  - "fspl"
  - "three_gpp_umi_los"
  - "three_gpp_umi_nlos"
  - "ci"
  - "abg"
  - "los_nlos_trans"
