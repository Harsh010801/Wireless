[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-propagation-analysis"
version = "1.0.0"
description = "Comparative Analysis and Simulation Framework for Wireless Signal Propagation Models"
readme = "README.md"
authors = [{ name = "Harsh Yadav", email = "researcher@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.0.0",
    "streamlit>=1.30.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

